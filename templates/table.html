<!DOCTYPE html>
<html>
<head>
    <title>Last Lines Table</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Last Lines from Numbered Files</h1>
    <table>
        <tr>
            <th>Last Line of File</th>
        </tr>
        {% for file in files %}
        <tr>
            <td>{{ file.last_line }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
