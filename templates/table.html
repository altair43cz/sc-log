<!DOCTYPE html>
<html>
<head>
    <title>Connecting...</title>
    <style>
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        tr.updated {
            transition: background-color 1s ease-in-out;
        }
    </style>
</head>
<body>
    <table>
        {% for file in files %}
        <tr id="row-{{ file.name }}" data-file="{{ file.name }}">
            <td id="content-{{ file.name }}">...</td>
        </tr>
        {% endfor %}
    </table>

    <script>
        const fileRows = new Set();
        {% for file in files %}
        fileRows.add('{{ file.name }}');
        {% endfor %}

        const eventSource = new EventSource('/stream');

        eventSource.onopen = function() {
            document.title = 'Connected - Streaming Updates';
        };

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (data.type === 'update') {
                const file = data.file;
                const content = data.content;
                const contentCell = document.getElementById(`content-${file}`);
                const row = document.getElementById(`row-${file}`);
                
                if (contentCell) {
                    contentCell.textContent = content;
                    // Add highlight effect
                    row.classList.add('updated');
                    setTimeout(() => {
                        row.classList.remove('updated');
                    }, 1000);
                }
            }
        };

        eventSource.onerror = function() {
            document.title = 'Disconnected - Attempting to reconnect...';
        };

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            eventSource.close();
        });
    </script>
</body>
</html>
